  - kind: pipeline
    name: Event-producer
    concurrentBuild: true
    definition:
      cpsFlowDefinition:
        sandbox: true
        script: |-
          pipeline {
              agent {
                  kubernetes {
                      yaml '''
          apiVersion: v1
          kind: Pod
          spec:
            nodeSelector:
              workload: agent
            tolerations:
            - key: workload
              operator: Equal
              value: agent
              effect: NoSchedule
            securityContext:
              fsGroup: 1000
            containers:
            - name: maven
              image: maven:3.9.9-eclipse-temurin-21
              command:
              - sleep
              args:
              - infinity
              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
