removeStrategy:
  rbac: SYNC
  items: NONE
items:
- kind: pipeline
  name: 00-HeloWorld
  concurrentBuild: true
  definition:
    cpsFlowDefinition:
      sandbox: true
      script: |
        pipeline {
            agent none

            stages {
                stage('Hello') {
                    steps {
                        echo 'Hello World'
                    }
                }
            }
        }
  description: ''
  disabled: false
  displayName: 00-HeloWorld
  resumeBlocked: false
- kind: pipeline
  name: 01-pipeline-simple
  concurrentBuild: true
  definition:
    cpsScmFlowDefinition:
      scriptPath: Jenkinsfile
      scm:
        scmGit:
          userRemoteConfigs:
          - userRemoteConfig:
              credentialsId: gh-pat
              url: https://github.com/pipeline-training-ws/sample-app-helloworld.git
          branches:
          - branchSpec:
              name: '*/main'
      lightweight: true
  description: ''
  disabled: false
  displayName: 01-pipeline-simple
  properties:
  - buildDiscarder:
      strategy:
        logRotator:
          removeLastBuild: false
          artifactDaysToKeep: -1
          artifactNumToKeep: -1
          daysToKeep: -1
          numToKeep: 5
  - durabilityHint:
      hint: PERFORMANCE_OPTIMIZED
  resumeBlocked: false
- kind: multibranch
  name: 02-MultiBranchJob-HelloWorld
  description: sample-app-helloworld
  displayName: 02-MultiBranchJob-HelloWorld
  orphanedItemStrategy:
    defaultOrphanedItemStrategy:
      pruneDeadBranches: true
      daysToKeep: -1
      numToKeep: -1
      abortBuilds: false
  projectFactory:
    workflowBranchProjectFactory:
      scriptPath: Jenkinsfile
  properties:
  - envVars: {}
  sourcesList:
  - branchSource:
      buildStrategies:
      - skipInitialBuildOnFirstIndexingResetRevision: {}
      source:
        github:
          apiUri: https://api.github.com
          traits:
          - gitHubBranchDiscovery:
              strategyId: 1
          - gitHubPullRequestDiscovery:
              strategyId: 2
          - gitHubForkDiscovery:
              trust:
                gitHubTrustPermissions: {}
              strategyId: 2
          - cloudBeesSCMReporting:
              visibleLinesOnly: false
              handlers:
              - pipelinePolicies: {}
              - endBuildError:
                  maxLogLines: 100
              - stage:
                  verbosity:
                    all: {}
              - junit: {}
          repoOwner: pipeline-training-ws
          credentialsId: gh-app
          id: '1'
          repository: sample-app-helloworld
          configuredByUrl: true
          repositoryUrl: https://github.com/pipeline-training-ws/sample-app-helloworld.git
      strategy:
        allBranchesSame: {}
  trigger:
    periodicFolderTrigger:
      interval: 1h
