- kind: cloudbeesTemplatedJob
  catalog: Pipeline Template Catalog Examples
  name: 05-PTC-job-MB
  model: Pipeline-Tem.c3qk18.log-Examples/1-helloWorld-MB
  attributes:
  - type: CREDENTIALS
    value: gh-app
    key: githubToken
  - type: string
    value: sample-app-helloWorld
    key: repoName
  - type: string
    value: pipeline-training-ws
    key: organisation
- kind: folder
  name: 06-parallel-samples
  description: ''
  displayName: 06-parallel-samples
  items:
  - kind: pipeline
    name: agent-global
    concurrentBuild: true
    definition:
      cpsFlowDefinition:
        sandbox: true
        script: |
          // Pattern: GLOBAL AGENT (Monolith)
          // A single Kubernetes pod is provisioned for the entire pipeline run.
          // Both parallel branches execute inside sibling containers of that ONE pod,
          // sharing the same workspace volume (emptyDir) and the same pod-level
          // resource envelope (requests/limits apply once, for the whole pod).
          pipeline {
              agent {
                  kubernetes {
                      yaml '''
          apiVersion: v1
          kind: Pod
          spec:
            nodeSelector:
              workload: agent
            tolerations:
            - key: workload
              operator: Equal
              value: agent
              effect: NoSchedule
            securityContext:
              fsGroup: 1000
            containers:
            - name: maven
              image: maven:3.9.9-eclipse-temurin-21
              command:
              - sleep
              args:
              - infinity
              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              securityContext:
                runAsUser: 1000
            - name: node
              image: node:20-alpine
              command:
              - sleep
              args:
              - infinity
              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              securityContext:
                runAsUser: 1000
          '''
                  }
              }
              stages {
                  stage('Parallel Build') {
                      parallel {
                          stage('Backend') {
                              steps {
                                  container('maven') {
                                      sh 'mvn -version'
                                  }
                              }
                          }
                          stage('Frontend') {
                              steps {
                                  container('node') {
                                      // Same shared workspace as the Backend branch above
                                      sh 'node -v'
                                  }
                              }
                          }
                      }
                  }
              }
          }
    description: ''
    disabled: false
    displayName: agent-global
    resumeBlocked: false
  - kind: pipeline
    name: agent-per-stage
    concurrentBuild: true
    definition:
      cpsFlowDefinition:
        sandbox: true
        script: |
          // Pattern: STAGE-SPECIFIC AGENT (Distributed)
          // No top-level agent is provisioned (agent none). Each parallel branch
          // requests its OWN Kubernetes pod, sized and specced only for that branch's
          // workload. Jenkins schedules the two pods independently, potentially on
          // different nodes, and each gets an isolated workspace/volume.
          pipeline {
              agent none
              stages {
                  stage('Parallel Build') {
                      parallel {
                          stage('Backend') {
                              agent {
                                  kubernetes {
                                      yaml '''
          apiVersion: v1
          kind: Pod
          spec:
            nodeSelector:
              workload: agent
            tolerations:
            - key: workload
              operator: Equal
              value: agent
              effect: NoSchedule
            securityContext:
              fsGroup: 1000
            containers:
            - name: maven
              image: maven:3.9.9-eclipse-temurin-21
              command:
              - sleep
              args:
              - infinity
              resources:
                requests:
                  cpu: "1"
                  memory: "1Gi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
              securityContext:
                runAsUser: 1000
          '''
                                  }
                              }
                              steps {
                                  container('maven') {
                                      sh 'mvn -version'
                                  }
                              }
                          }
                          stage('Frontend') {
                              agent {
                                  kubernetes {
                                      yaml '''
          apiVersion: v1
          kind: Pod
          spec:
            nodeSelector:
              workload: agent
            tolerations:
            - key: workload
              operator: Equal
              value: agent
              effect: NoSchedule
            securityContext:
              fsGroup: 1000
            containers:
            - name: node
              image: node:20-alpine
              command:
              - sleep
              args:
              - infinity
              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              securityContext:
                runAsUser: 1000
          '''
                                  }
                              }
                              steps {
                                  container('node') {
                                      sh 'node -v'
                                  }
                              }
                          }
                      }
                  }
              }
          }
    description: ''
    disabled: false
    displayName: agent-per-stage
    resumeBlocked: false
  properties:
  - envVars: {}
  - itemRestrictions:
      filter: false
